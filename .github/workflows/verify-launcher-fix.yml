name: Verify launcher Kotlin fix (no tsc gate)

# Temporary verification for PR #822. Mirrors the REAL production build path
# (auto-release.yml build-apk job) which runs expo prebuild -> assembleRelease
# WITHOUT a tsc/lint gate. build-apk.yml has a `npx tsc --noEmit` gate that fails
# on pre-existing baseline errors unrelated to this fix, so it never reaches the
# Gradle step. This workflow isolates whether the Kotlin actually compiles.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK (verify)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iosToAndroid-verify-launcher-fix
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
