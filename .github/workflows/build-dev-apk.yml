name: Build Dev APK

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# A dev APK is only interesting for the tip of dev; a push that lands while an
# older build is still running makes that build dead weight in the queue.
concurrency:
  group: build-dev-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Dev APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      # Runs after prebuild so the generated wrapper exists and gets validated.
      # cache-read-only defaults to true off the default branch; dev builds are
      # the frequent path, so let them write (and reuse) their own cache.
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # arm64-v8a only: a dev APK is for a real phone, and dropping the x86
      # emulator ABIs removes most of the CMake work from the build.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: iosToAndroid-dev-${{ steps.sha.outputs.short }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
