name: Build Android APK

on:
  # Manual trigger only — APK is built automatically by auto-release.yml on PR merge
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Type check
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      # Dispatched from main, so this run is what seeds the default-branch Gradle
      # cache that auto-release.yml (which fires on a pull_request ref and can
      # only read) restores.
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Shipped APK keeps 32-bit ARM for older devices; the x86 emulator ABIs are
      # dropped, which is where most of the CMake time went.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: iosToAndroid-${{ github.event.release.tag_name || 'dev' }}
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
